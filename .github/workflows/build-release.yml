name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Prepare local electron dist for packaging
        run: Copy-Item -Recurse -Force node_modules/electron/dist .electron-dist

      - name: Build installer (electron-builder)
        run: npm run dist

      - name: Prepare Release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $setup = (Get-ChildItem dist-electron -Filter "moye-novel-setup-*.exe" | Select-Object -First 1).FullName
          Copy-Item $setup "release\moye-novel-setup.exe"

      - name: Upload Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: 墨页 ${{ github.ref_name }}
          body: |
            ## 墨页 · 本地轻量小说写作软件 ${{ github.ref_name }}

            基于 **Electron** 重写，原生文件系统读写，数据存到 `AppData\墨页\data`（永远可写），
            彻底解决旧版「装在 Program Files 后数据写不进」的问题。

            ### 一键安装（推荐）
            - 下载 `moye-novel-setup.exe`，双击运行，按向导安装
            - 安装后可从**开始菜单 / 桌面快捷方式**启动，并自带卸载程序
            - 若被 SmartScreen 拦截，点“更多信息”→“仍要运行”即可（本软件未做代码签名，属正常现象）

            ### 特性
            纯本地、不联网；分卷/章节管理、自动保存、实时字数统计、每日码字目标与进度、写作热力图、大纲/人物/设定/灵感资料栏、素材卡片、查找替换、历史快照、专注模式、三种主题、TXT / Markdown 导出与备份。

            ### 数据位置
            - 优先：`exe 同级 data/`（便携版/解压即用，整包可带走）
            - 兜底：`%APPDATA%\墨页\data`（安装到系统目录时自动使用，永远可写）
            - 设置里点「打开数据文件夹」可直接打开。
          files: |
            release/moye-novel-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
